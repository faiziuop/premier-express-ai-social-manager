<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Premier Express AI Social Manager</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f5f7fb;color:#172033}header{background:#111827;color:#fff;padding:20px 25px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}main{max-width:1100px;margin:25px auto;padding:0 16px}.card{background:#fff;border-radius:14px;padding:18px;margin:15px 0;box-shadow:0 2px 12px #0001}button{border:0;border-radius:8px;padding:10px 14px;margin:4px;cursor:pointer;font-weight:bold}.ok{background:#087f5b;color:#fff}.bad{background:#b42318;color:#fff}.gray{background:#e5e7eb}input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ccd1d9;border-radius:8px;margin:5px 0 12px}.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.stat{font-size:28px;font-weight:bold}.caption{white-space:pre-wrap;line-height:1.5}.pill{background:#fef3c7;padding:5px 9px;border-radius:20px;font-size:12px;font-weight:bold}@media(max-width:700px){.statgrid{grid-template-columns:1fr}}
</style></head>
<body>
<header><div><b>Premier Express AI Social Manager</b><br><small>Approval-first content engine</small></div>
<div id="toolbar"><button class="ok" onclick="generate()">Generate today's 5 posts</button><button class="gray" onclick="loadPosts()">Refresh</button><button class="gray" onclick="logout()">Logout</button></div></header>
<main>
<div id="auth" class="card"><h2>Secure login</h2><p>Use your work email and a password for this private dashboard. This login is separate from your OpenAI key.</p>
<label>Email</label><input id="email" type="email" placeholder="your email">
<label>Password</label><input id="password" type="password" placeholder="At least 6 characters">
<button class="ok" onclick="signIn()">Sign in</button><button class="gray" onclick="signUp()">Create account</button>
<p id="authmsg"></p></div>
<div id="app" style="display:none">
<div class="statgrid"><div class="card"><small>Posts</small><div id="total" class="stat">0</div></div><div class="card"><small>Pending approval</small><div id="pending" class="stat">0</div></div><div class="card"><small>Approved</small><div id="approved" class="stat">0</div></div></div><div id="posts"></div>
</div></main>
<script>
const URL="https://ivtwkyfiagouazopttlc.supabase.co";
const KEY=localStorage.getItem("supabase_key")||prompt("Paste your Supabase Publishable/Anon key (never a Secret/Service-Role key):");
if(KEY)localStorage.setItem("supabase_key",KEY);
async function auth(path,body){let r=await fetch(URL+"/auth/v1/"+path,{method:"POST",headers:{"apikey":KEY,"Content-Type":"application/json"},body:JSON.stringify(body)});let j=await r.json();if(!r.ok)throw Error(j.msg||j.error_description||JSON.stringify(j));return j}
function setAuthMsg(x){document.getElementById("authmsg").textContent=x}
async function signIn(){try{let j=await auth("token?grant_type=password",{email:email.value,password:password.value});localStorage.setItem("access_token",j.access_token);localStorage.setItem("refresh_token",j.refresh_token);showApp()}catch(e){setAuthMsg(e.message)}}
async function signUp(){try{let j=await auth("signup",{email:email.value,password:password.value});setAuthMsg(j.session?"Account created and logged in.":"Account created. Check your email to confirm, then Sign in.");if(j.session){localStorage.setItem("access_token",j.access_token);showApp()}}catch(e){setAuthMsg(e.message)}}
function token(){return localStorage.getItem("access_token")||""}
function headers(){return {"apikey":KEY,"Authorization":"Bearer "+token(),"Content-Type":"application/json"}}
async function api(path,opt={}){let r=await fetch(URL+"/rest/v1/"+path,{...opt,headers:{...headers(),...(opt.headers||{})}});if(!r.ok)throw Error(await r.text());return r.status===204?null:r.json()}
function esc(s){return String(s??"").replace(/[&<>"']/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[x]))}
function showApp(){document.getElementById("auth").style.display="none";document.getElementById("app").style.display="block";loadPosts()}
function logout(){localStorage.removeItem("access_token");localStorage.removeItem("refresh_token");location.reload()}
async function loadPosts(){try{let d=await api("content_posts?select=*&order=post_number.asc&limit=10");total.textContent=d.length;pending.textContent=d.filter(x=>x.status==="PENDING_APPROVAL").length;approved.textContent=d.filter(x=>["APPROVED","READY_TO_PUBLISH"].includes(x.status)).length;posts.innerHTML=d.map(p=>`<div class="card"><span class="pill">${esc(p.status)}</span><h2>${esc(p.post_number)}. ${esc(p.hook||p.objective)}</h2><small>${esc((p.platforms||[]).join(" • "))}</small><p class="caption">${esc(p.caption)}</p><p><b>CTA:</b> ${esc(p.cta||"")}<br><b>Visual:</b> ${esc(p.visual_direction||"")}</p><button class="ok" onclick="approve('${p.id}')">✓ Approve</button><button class="gray" onclick="editPost('${p.id}')">✎ Edit</button><button class="gray" onclick="regen('${p.id}')">↻ Regenerate</button><button class="bad" onclick="reject('${p.id}')">✕ Reject</button></div>`).join("")||'<div class="card"><h3>No posts yet</h3>Click Generate today\'s 5 posts.</div>'}catch(e){posts.innerHTML='<div class="card"><b>Database error</b><pre>'+esc(e.message)+'</pre></div>'}}
async function generate(){try{let r=await fetch(URL+"/functions/v1/generate-daily-content",{method:"POST",headers:headers()});let j=await r.json();if(!r.ok||!j.success)throw Error(j.error||JSON.stringify(j));alert("5 posts generated and placed in PENDING APPROVAL.");loadPosts()}catch(e){alert(e.message)}}
async function approve(id){await api("content_posts?id=eq."+id,{method:"PATCH",body:JSON.stringify({status:"APPROVED",approved_at:new Date().toISOString()})});await api("approval_events",{method:"POST",body:JSON.stringify({post_id:id,action:"APPROVE"})});loadPosts()}
async function reject(id){let n=prompt("Reason (optional):")||"";await api("content_posts?id=eq."+id,{method:"PATCH",body:JSON.stringify({status:"REJECTED",rejection_reason:n})});await api("approval_events",{method:"POST",body:JSON.stringify({post_id:id,action:"REJECT",notes:n})});loadPosts()}
async function editPost(id){let d=await api("content_posts?id=eq."+id+"&select=caption");let v=prompt("Edit caption:",d[0].caption);if(v===null)return;if(!v.includes("+971 56 202 6553"))return alert("WhatsApp number must remain in every post.");await api("content_posts?id=eq."+id,{method:"PATCH",body:JSON.stringify({caption:v,status:"EDIT_REQUESTED"})});await api("approval_events",{method:"POST",body:JSON.stringify({post_id:id,action:"EDIT",notes:"Caption edited"})});loadPosts()}
function regen(){alert("Regeneration will be connected next; approval remains mandatory.")}
if(token())showApp();
</script></body></html>
