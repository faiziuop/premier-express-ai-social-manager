<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Premier Express AI Social Manager</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f5f7fb;color:#172033}header{background:#111827;color:white;padding:20px 25px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}main{max-width:1100px;margin:25px auto;padding:0 16px}.card{background:white;border-radius:14px;padding:18px;margin:15px 0;box-shadow:0 2px 12px #0001}button{border:0;border-radius:8px;padding:10px 14px;margin:4px;cursor:pointer;font-weight:bold}.ok{background:#087f5b;color:#fff}.bad{background:#b42318;color:#fff}.gray{background:#e5e7eb}.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.stat{font-size:28px;font-weight:bold}input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ccd1d9;border-radius:8px;margin:5px 0 12px}.caption{white-space:pre-wrap;line-height:1.5}.pill{background:#fef3c7;padding:5px 9px;border-radius:20px;font-size:12px;font-weight:bold}@media(max-width:700px){.statgrid{grid-template-columns:1fr}}
</style></head>
<body>
<header><div><b>Premier Express AI Social Manager</b><br><small>Approval-first dashboard</small></div>
<div><button class="ok" onclick="generate()">Generate today's 5 posts</button><button class="gray" onclick="loadPosts()">Refresh</button></div></header>
<main>
<div class="card"><h2>One-time connection</h2>
<p>Use your Supabase <b>Publishable/Anon key only</b>. Never paste a Secret/Service-Role key here.</p>
<label>Supabase Project URL</label><input id="url" value="https://ivtwkyfiagouazopttlc.supabase.co">
<label>Supabase Publishable/Anon Key</label><input id="key" type="password" placeholder="Paste publishable/anon key">
<button class="ok" onclick="save()">Save connection</button> <span id="msg"></span></div>
<div class="statgrid"><div class="card"><small>Posts</small><div id="total" class="stat">0</div></div><div class="card"><small>Pending approval</small><div id="pending" class="stat">0</div></div><div class="card"><small>Approved</small><div id="approved" class="stat">0</div></div></div>
<div id="posts"></div>
</main>
<script>
const WA="+971 56 202 6553";
function cfg(){return {u:localStorage.getItem("su")||"",k:localStorage.getItem("sk")||""}}
const c=cfg(); if(c.u)document.getElementById("url").value=c.u;
function save(){let u=document.getElementById("url").value.trim(),k=document.getElementById("key").value.trim();if(!u||!k)return alert("Enter both fields.");localStorage.setItem("su",u);localStorage.setItem("sk",k);document.getElementById("msg").textContent=" Saved";loadPosts()}
function esc(s){return String(s??"").replace(/[&<>"']/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[x]))}
async function api(path,opt={}){let c=cfg();if(!c.u||!c.k)throw Error("Connect Supabase first.");let h=Object.assign({"apikey":c.k,"Authorization":"Bearer "+c.k,"Content-Type":"application/json"},opt.headers||{});let r=await fetch(c.u+"/rest/v1/"+path,{...opt,headers:h});if(!r.ok)throw Error(await r.text());return r.status===204?null:r.json()}
async function loadPosts(){try{let d=await api("content_posts?select=*&order=post_number.asc&limit=10");document.getElementById("total").textContent=d.length;document.getElementById("pending").textContent=d.filter(x=>x.status==="PENDING_APPROVAL").length;document.getElementById("approved").textContent=d.filter(x=>["APPROVED","READY_TO_PUBLISH"].includes(x.status)).length;document.getElementById("posts").innerHTML=d.map(p=>`<div class="card"><span class="pill">${esc(p.status)}</span><h2>${esc(p.post_number)}. ${esc(p.hook||p.objective)}</h2><small>${esc((p.platforms||[]).join(" • "))}</small><p class="caption">${esc(p.caption)}</p><p><b>CTA:</b> ${esc(p.cta||"")}<br><b>Visual:</b> ${esc(p.visual_direction||"")}</p><button class="ok" onclick="approve('${p.id}')">✓ Approve</button><button class="gray" onclick="editPost('${p.id}')">✎ Edit</button><button class="gray" onclick="regen('${p.id}')">↻ Regenerate</button><button class="bad" onclick="reject('${p.id}')">✕ Reject</button></div>`).join("")||'<div class="card"><h3>No posts yet</h3>Click Generate.</div>'}catch(e){document.getElementById("posts").innerHTML='<div class="card"><b>Connection error</b><pre>'+esc(e.message)+'</pre></div>'}}
async function generate(){try{let c=cfg();if(!c.u||!c.k)throw Error("Connect Supabase first.");let r=await fetch(c.u+"/functions/v1/generate-daily-content",{method:"POST",headers:{"apikey":c.k,"Authorization":"Bearer "+c.k,"Content-Type":"application/json"}});let j=await r.json();if(!r.ok||!j.success)throw Error(j.error||JSON.stringify(j));alert("5 posts generated and placed in PENDING APPROVAL.");loadPosts()}catch(e){alert(e.message)}}
async function approve(id){await api("content_posts?id=eq."+id,{method:"PATCH",body:JSON.stringify({status:"APPROVED",approved_at:new Date().toISOString()})});await api("approval_events",{method:"POST",body:JSON.stringify({post_id:id,action:"APPROVE"})});loadPosts()}
async function reject(id){let n=prompt("Reason (optional):")||"";await api("content_posts?id=eq."+id,{method:"PATCH",body:JSON.stringify({status:"REJECTED",rejection_reason:n})});await api("approval_events",{method:"POST",body:JSON.stringify({post_id:id,action:"REJECT",notes:n})});loadPosts()}
async function editPost(id){let d=await api("content_posts?id=eq."+id+"&select=caption");let v=prompt("Edit caption:",d[0].caption);if(v===null)return;if(!v.includes(WA))return alert("WhatsApp number must remain in every post.");await api("content_posts?id=eq."+id,{method:"PATCH",body:JSON.stringify({caption:v,status:"EDIT_REQUESTED"})});await api("approval_events",{method:"POST",body:JSON.stringify({post_id:id,action:"EDIT",notes:"Caption edited"})});loadPosts()}
function regen(id){alert("AI regeneration endpoint is the next backend step. The post remains unapproved.")}
if(cfg().u&&cfg().k)loadPosts();
</script></body></html>
