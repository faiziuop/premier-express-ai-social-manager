<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Premier Express AI Social Manager</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
header{background:#111827;color:white;padding:18px 24px;display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}
header small{opacity:.75}.wrap{max-width:1120px;margin:24px auto;padding:0 16px}.card{background:white;border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 2px 12px #00000012}
button{border:0;border-radius:8px;padding:10px 14px;margin:3px;cursor:pointer;font-weight:700}.primary{background:#087f5b;color:#fff}.danger{background:#b42318;color:#fff}.muted{background:#e5e7eb;color:#172033}
input{width:100%;padding:11px;border:1px solid #ccd1d9;border-radius:8px;margin:5px 0 12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.stat{font-size:28px;font-weight:700}
.post{border-left:4px solid #f59e0b}.pill{display:inline-block;background:#fef3c7;padding:5px 9px;border-radius:20px;font-size:12px;font-weight:700}.caption{white-space:pre-wrap;line-height:1.55}
.notice{background:#ecfdf3;border-left:4px solid #087f5b}.live{font-size:12px;color:#087f5b;font-weight:700}
@media(max-width:700px){.stats{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
<div><b>Premier Express AI Social Manager</b><br><small>Approval-first • Live dashboard</small></div>
<div id="toolbar" style="display:none">
<button class="primary" id="generateBtn">Generate today's 5 posts</button>
<button class="muted" id="logoutBtn">Logout</button>
</div>
</header>
<div class="wrap">
<div id="authCard" class="card">
<h2>Secure login</h2><p>Sign in to your private marketing dashboard.</p>
<label>Email</label><input id="email" type="email" autocomplete="username">
<label>Password</label><input id="password" type="password" autocomplete="current-password">
<button class="primary" id="signinBtn">Sign in</button><button class="muted" id="signupBtn">Create account</button>
<p id="authMsg"></p>
</div>

<div id="app" style="display:none">
<div class="card notice"><b>Live mode:</b> database changes are synchronized automatically. <span id="realtimeStatus" class="live">Connecting to live updates…</span></div>
<div class="stats">
<div class="card"><small>Posts</small><div id="total" class="stat">0</div></div>
<div class="card"><small>Pending approval</small><div id="pending" class="stat">0</div></div>
<div class="card"><small>Approved</small><div id="approved" class="stat">0</div></div>
</div>
<div id="posts"></div>
</div>
</div>

<script>
const SUPABASE_URL="https://ivtwkyfiagouazopttlc.supabase.co";
const SUPABASE_KEY=localStorage.getItem("supabase_key") || prompt("Paste your Supabase Publishable/Anon key (never a Secret/Service-Role key):");
if(SUPABASE_KEY) localStorage.setItem("supabase_key",SUPABASE_KEY);

const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{
  auth:{autoRefreshToken:true,persistSession:true,detectSessionInUrl:true}
});
let realtimeChannel=null;

const $=id=>document.getElementById(id);
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));}

async function renderPosts(){
  const {data,error}=await sb.from("content_posts").select("*").order("post_number",{ascending:true}).limit(20);
  if(error){$("posts").innerHTML="<div class='card'><b>Database error</b><pre>"+esc(JSON.stringify(error,null,2))+"</pre></div>";return;}
  const rows=data||[];
  $("total").textContent=rows.length;
  $("pending").textContent=rows.filter(x=>x.status==="PENDING_APPROVAL").length;
  $("approved").textContent=rows.filter(x=>["APPROVED","READY_TO_PUBLISH"].includes(x.status)).length;
  $("posts").innerHTML=rows.map(p=>`
  <div class="card post">
    <span class="pill">${esc(p.status)}</span>
    <h2>${esc(p.post_number)}. ${esc(p.hook||p.objective||"Post")}</h2>
    <small>${esc((p.platforms||[]).join(" • "))} | ${esc(p.content_type||"")}</small>
    <p class="caption">${esc(p.caption||"")}</p>
    <p><b>CTA:</b> ${esc(p.cta||"")}<br><b>Visual:</b> ${esc(p.visual_direction||"")}</p>
    ${p.status==="PENDING_APPROVAL"||p.status==="EDIT_REQUESTED"?`
      <button class="primary" onclick="approvePost('${esc(p.id)}')">✓ Approve</button>
      <button class="muted" onclick="editPost('${esc(p.id)}')">✎ Edit</button>
      <button class="danger" onclick="rejectPost('${esc(p.id)}')">✕ Reject</button>`:""}
  </div>`).join("") || "<div class='card'><h3>No posts yet</h3>Click Generate today's 5 posts.</div>";
}

async function subscribeRealtime(){
  if(realtimeChannel) await sb.removeChannel(realtimeChannel);
  realtimeChannel=sb.channel("content-posts-live")
    .on("postgres_changes",{event:"*",schema:"public",table:"content_posts"},payload=>{
      console.log("Realtime content_posts event:",payload);
      renderPosts();
    })
    .subscribe(status=>{
      if(status==="SUBSCRIBED") $("realtimeStatus").textContent="● Live updates connected";
      else if(status==="CHANNEL_ERROR") $("realtimeStatus").textContent="Live connection error — retrying…";
      else $("realtimeStatus").textContent="Live status: "+status;
    });
}

async function approvePost(id){
  const {error}=await sb.from("content_posts").update({
    status:"APPROVED",approved_at:new Date().toISOString()
  }).eq("id",id);
  if(error){alert("Approval failed: "+error.message);return;}
  await sb.from("approval_events").insert({post_id:id,action:"APPROVE"});
  // Realtime should update the UI; this fallback also keeps the button responsive.
  await renderPosts();
}

async function rejectPost(id){
  const reason=prompt("Reason (optional):")||"";
  const {error}=await sb.from("content_posts").update({
    status:"REJECTED",rejection_reason:reason
  }).eq("id",id);
  if(error){alert("Reject failed: "+error.message);return;}
  await sb.from("approval_events").insert({post_id:id,action:"REJECT",notes:reason});
  await renderPosts();
}

async function editPost(id){
  const {data,error}=await sb.from("content_posts").select("caption").eq("id",id).single();
  if(error){alert(error.message);return;}
  const value=prompt("Edit caption:",data.caption||"");
  if(value===null)return;
  if(!value.includes("+971 56 202 6553")){alert("The WhatsApp number +971 56 202 6553 must remain in every post.");return;}
  const {error:e}=await sb.from("content_posts").update({caption:value,status:"EDIT_REQUESTED"}).eq("id",id);
  if(e){alert(e.message);return;}
  await sb.from("approval_events").insert({post_id:id,action:"EDIT",notes:"Caption edited"});
  await renderPosts();
}

async function generate(){
  $("generateBtn").disabled=true;$("generateBtn").textContent="Generating…";
  try{
    const {data:{session}}=await sb.auth.getSession();
    if(!session){alert("Your session has expired. Please sign in again.");return;}
    const r=await fetch(SUPABASE_URL+"/functions/v1/generate-daily-content",{
      method:"POST",
      headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+session.access_token,"Content-Type":"application/json"}
    });
    const j=await r.json();
    if(!r.ok||!j.success) throw new Error(j.error||JSON.stringify(j));
    await renderPosts();
    alert("5 posts generated and placed in PENDING APPROVAL.");
  }catch(e){alert("Generation failed: "+e.message)}
  finally{$("generateBtn").disabled=false;$("generateBtn").textContent="Generate today's 5 posts";}
}

async function enterApp(){
  $("authCard").style.display="none";$("app").style.display="block";$("toolbar").style.display="block";
  await renderPosts(); await subscribeRealtime();
}
async function leaveApp(){
  if(realtimeChannel) await sb.removeChannel(realtimeChannel);
  $("app").style.display="none";$("toolbar").style.display="none";$("authCard").style.display="block";
}
async function logout(){await sb.auth.signOut();await leaveApp();$("authMsg").textContent="Signed out.";}

$("signinBtn").onclick=async()=>{
  const {error}=await sb.auth.signInWithPassword({email:$("email").value,password:$("password").value});
  $("authMsg").textContent=error?error.message:"Signed in.";
};
$("signupBtn").onclick=async()=>{
  const {data,error}=await sb.auth.signUp({email:$("email").value,password:$("password").value});
  $("authMsg").textContent=error?error.message:(data.session?"Account created and signed in.":"Account created. Check your email, then sign in.");
};
$("generateBtn").onclick=generate;$("logoutBtn").onclick=logout;

sb.auth.onAuthStateChange(async(event,session)=>{
  if(session) await enterApp(); else await leaveApp();
});
sb.auth.getSession().then(({data})=>{if(data.session) enterApp();});
</script>
</body></html>
